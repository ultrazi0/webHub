stages:
  - build
  - test
  - integration-test
  - deploy

image: eclipse-temurin:21

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  script:
    - chmod +x gradlew
    - ./gradlew --build-cache assemble
  needs: []
  dependencies: []
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
  artifacts:
    when: on_success
    name: webHub-backend
    paths:
      - build/libs/*.jar
    exclude:
      - build/libs/*plain.jar

test:
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew test
  needs:
    - build
  dependencies: []
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
  artifacts:
    when: always
    paths:
      - build/reports/tests

integration-test:
  stage: integration-test
  variables:
    DB_NAME: "webHubDB"
    DB_URL: jdbc:postgresql://db:5432/$DB_NAME?currentSchema=bot
    DB_USERNAME: server
    DB_PASSWORD: server
  services:
    - name: postgres
      alias: db
      variables:
        POSTGRES_DB: $DB_NAME
        POSTGRES_USER: $DB_USERNAME
        POSTGRES_PASSWORD: $DB_PASSWORD
  script:
    - chmod +x gradlew
    - ./gradlew integrationTest
  needs:
    - build
  dependencies: []
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
  artifacts:
    when: always
    paths:
      - build/reports/tests

release-test-image:
  stage: deploy
  image: docker
  when: manual
  services:
    - name: docker:dind
      alias: docker
  variables:
    TEST_IMAGE: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA
  needs:
    - build
  dependencies:
    - build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build --pull -t $TEST_IMAGE .
    - docker push $TEST_IMAGE


deploy:
  inherit:
    default: false
  stage: deploy
  script: echo "Define your deployment script!"
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
