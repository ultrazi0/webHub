plugins {
    id "com.tngtech.jgiven.gradle-plugin" version "1.3.1"
    id "io.freefair.lombok" version "8.10.2"
}

group = 'com.nemo'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    implementation rootProject
    testImplementation 'io.rest-assured:rest-assured:5.5.0'

    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.postgresql:postgresql:42.+'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    testImplementation 'com.codeborne:selenide:7.5.1'
    testImplementation 'com.tngtech.jgiven:jgiven-spring-junit5:1.3.1'

    testImplementation 'org.projectlombok:lombok:1.18.34'

}

test {
    useJUnitPlatform()

    finalizedBy jgivenTestReport
}

jgivenTestReport {
    reports {
        html.customJsFile = file('src/test/resources/jgiven/custom.js')
        html.customCssFile = file('src/test/resources/jgiven/custom.css')
    }

    doLast {
        ant.replaceregexp(file: "build/reports/jgiven/test/html/index.html",
                match: 'ng-init="step = scenarioCase\\.steps\\[\\$parent\\.\\$index\\]"',
                replace: 'ng-init="step = getCaseStep(step, scenarioCase, $parent)"')
    }
}
