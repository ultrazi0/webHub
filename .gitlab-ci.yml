stages:
  - build
  - test
  - integration-test
  - deploy
  - system-test

image: eclipse-temurin:21

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:
  stage: build
  script:
    - chmod +x gradlew
    - ./gradlew --build-cache webapp:assemble
  needs: []
  dependencies: []
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - webapp/build
      - .gradle
  artifacts:
    when: on_success
    name: webHub-backend
    paths:
      - webapp/build/libs/*.jar

test:
  stage: test
  script:
    - chmod +x gradlew
    - ./gradlew webapp:test
  needs:
    - build
  dependencies: []
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - webapp/build
      - .gradle
  artifacts:
    when: always
    reports:
      junit: webapp/build/test-results/**/*.xml

integration-test:
  stage: integration-test
  variables:
    DB_NAME: "webHubDB"
    DB_URL: jdbc:postgresql://db:5432/$DB_NAME?currentSchema=bot
    DB_USERNAME: server
    DB_PASSWORD: server
  services:
    - name: postgres
      alias: db
      variables:
        POSTGRES_DB: $DB_NAME
        POSTGRES_USER: $DB_USERNAME
        POSTGRES_PASSWORD: $DB_PASSWORD
  script:
    - chmod +x gradlew
    - ./gradlew webapp:integrationTest
  needs:
    - build
  dependencies: []
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - webapp/build
      - .gradle
  artifacts:
    when: always
    reports:
      junit: webapp/build/test-results/**/*.xml

.docker-variables:
  variables:
    TEST_IMAGE: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA

release-test-image:
  stage: deploy
  image: docker
  #when: manual
  services:
    - name: docker:dind
      alias: docker
  variables:
    TEST_IMAGE: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA
  dependencies:
    - build
  needs:
    - build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build --pull --target jar -t $TEST_IMAGE .
    - docker push $TEST_IMAGE

system-test:
  stage: system-test
  variables:
    FF_NETWORK_PER_BUILD: 1
    TEST_IMAGE: $CI_REGISTRY_IMAGE/test:$CI_COMMIT_SHORT_SHA
    DB_NAME: "webHubDB"
    DB_URL: jdbc:postgresql://db:5432/$DB_NAME?currentSchema=bot
    DB_USERNAME: server
    DB_PASSWORD: server
  services:
    - name: postgres
      alias: db
      variables:
        POSTGRES_DB: $DB_NAME
        POSTGRES_USER: $DB_USERNAME
        POSTGRES_PASSWORD: $DB_PASSWORD
    - name: $TEST_IMAGE
      alias: backend
  needs:
    - release-test-image
  script:
    - chmod +x gradlew
    - ./gradlew testing:apiTest -Dspring.datasource.url=$DB_URL -Drest-assured.base-uri=http://backend
  artifacts:
    when: always
    reports:
      junit: testing/build/test-results/**/*.xml


deploy:
  inherit:
    default: false
  stage: deploy
  script: echo "Define your deployment script!"
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
