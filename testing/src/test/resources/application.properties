# Database
spring.datasource.url = jdbc:postgresql://localhost:5432/rexus-db?currentSchema=bot
spring.datasource.username = server
spring.datasource.password = server
spring.datasource.driver-class-name = org.postgresql.Driver

# Selenide
selenide.base-url = http://localhost:3000/
selenide.timeout = 2000
selenide.polling-interval = 50
selenide.browser = chrome
selenide.browser-size = 1366x1024
selenide.screenshots = false
selenide.headless = false
selenide.remote =

# RestAssured
rest-assured.base-uri = http://localhost
rest-assured.default-port = 8080
rest-assured.base-path = /api
rest-assured.csrf-path = /csrf
